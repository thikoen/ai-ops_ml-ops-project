services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One Python image, three explicit invocations. No scheduler or extra platform.
  pipeline:
    build: .
    profiles: ["pipelines"]
    env_file: .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      WORK_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      minio:
        condition: service_healthy
    command: ["--help"]

volumes:
  minio-data:
